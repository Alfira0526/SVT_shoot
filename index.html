<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0b1a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%8E%3C/text%3E%3C/svg%3E"
    />
    <title>빛의 세계 — DIA</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        height: 100dvh; /* 모바일 브라우저 UI 바 대응 (지원 시) */
        background: #0d0b1a;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-root canvas {
        display: block;
        touch-action: none;
      }
      /* 닉네임 입력 등 DOM 오버레이용 폰트 */
      * {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic',
          'Apple SD Gothic Neo', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
