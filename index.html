<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1b3a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="덕질할 결심" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="2~3분 안에 덕질 스트레스를 탄막으로 해소하는 모바일 세로 슈팅. 티켓팅 서버를 정공법으로 뚫어라. 비영리 팬 창작 게임." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="덕질할 결심 — 세로 탄막 슈팅" />
  <meta property="og:description" content="대기번호 999,999번. ……뒤로 가. — 티켓팅 서버를 정공법으로 뚫는 2~3분 공감 아케이드" />
  <meta property="og:image" content="./og.png" />
  <meta property="og:locale" content="ko_KR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="덕질할 결심 — 세로 탄막 슈팅" />
  <meta name="twitter:description" content="티켓팅 서버를 정공법으로 뚫는 2~3분 공감 아케이드. 비영리 팬 창작." />
  <meta name="twitter:image" content="./og.png" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-192.png" />
  <title>덕질할 결심</title>
  <style>
    :root {
      --deep: #1e1b3a;
      --panel: #272250;
      --rose: #ff9ecb;
      --serenity: #86c8ff;
      --cream: #fff3c4;
      --grape: #b18cff;
      --danger: #ff6b8a;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--deep);
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--cream);
    }
    #game {
      position: fixed;
      inset: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas { display: block; }

    /* 닉네임 입력 오버레이 — 모바일 키보드 호환을 위해 HTML 사용 (§11 타이틀 → 최초 1회 닉네임 입력) */
    #nick-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(30, 27, 58, 0.86);
      z-index: 10;
    }
    #nick-overlay.open { display: flex; }
    #nick-card {
      width: min(86vw, 340px);
      background: var(--panel);
      border: 2px solid var(--grape);
      border-radius: 18px;
      padding: 22px 20px 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    #nick-card h2 { margin: 0 0 6px; font-size: 20px; color: var(--cream); }
    #nick-card p { margin: 0 0 14px; font-size: 13px; color: var(--serenity); line-height: 1.5; }
    #nick-input {
      width: 100%;
      box-sizing: border-box;
      font-size: 20px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid var(--serenity);
      background: #1a1733;
      color: var(--cream);
      text-align: center;
      outline: none;
      font-family: inherit;
    }
    #nick-input:focus { border-color: var(--rose); }
    #nick-msg { min-height: 18px; margin: 8px 0 10px; font-size: 12px; color: var(--danger); }
    #nick-actions { display: flex; gap: 10px; }
    #nick-actions button {
      flex: 1;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 0;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    #nick-ok { background: var(--rose); color: #2a1030; }
    #nick-cancel { background: #3a3566; color: var(--cream); }
    #nick-cancel[hidden] { display: none; }

    /* 가로 모드 안내 (세로 전용 게임) */
    #rotate-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background: var(--deep);
      z-index: 20;
      text-align: center;
      font-size: 18px;
      line-height: 1.6;
    }
    #rotate-overlay span { font-size: 44px; }
    @media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) {
      #rotate-overlay { display: flex; }
    }

    /* 치명적 오류 안내 */
    #error-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: rgba(30, 27, 58, 0.96);
      z-index: 30;
      text-align: center;
      padding: 24px;
    }
    #error-overlay button {
      font-size: 17px;
      font-weight: 700;
      padding: 12px 28px;
      border: 0;
      border-radius: 12px;
      background: var(--rose);
      color: #2a1030;
      font-family: inherit;
    }
    #error-overlay small { color: #8f8bb0; font-size: 11px; word-break: break-all; }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="nick-overlay" role="dialog" aria-modal="true" aria-labelledby="nick-title">
    <form id="nick-card" autocomplete="off">
      <h2 id="nick-title">수호자 닉네임</h2>
      <p>대사와 랭킹에 그대로 표시돼요.<br />2~8자 · 로그인 없음 · 개인정보 미수집</p>
      <input id="nick-input" type="text" maxlength="8" placeholder="닉네임 입력" inputmode="text" enterkeyhint="done" />
      <div id="nick-msg"></div>
      <div id="nick-actions">
        <button type="button" id="nick-cancel" hidden>취소</button>
        <button type="submit" id="nick-ok">결정</button>
      </div>
    </form>
  </div>

  <div id="rotate-overlay" aria-live="polite">
    <span>📱</span>
    <div>세로 전용 게임이에요.<br />기기를 세로로 돌려 주세요.</div>
  </div>

  <div id="error-overlay" role="alert">
    <div>앗, 빛이 잠깐 끊겼어요.<br />새로고침하면 바로 이어서 할 수 있어요.</div>
    <button type="button" onclick="location.reload()">새로고침</button>
    <small id="error-detail"></small>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1e1b3a;color:#fff3c4;text-align:center;padding:24px;">
      이 게임은 JavaScript가 필요해요. 브라우저 설정에서 JavaScript를 켜 주세요.
    </div>
  </noscript>

  <script>
    // 예기치 못한 오류 시 안내 — 진행도는 localStorage에 있어 새로고침해도 유지됨
    window.addEventListener('error', function (e) {
      var box = document.getElementById('error-overlay');
      if (!box || box.style.display === 'flex') return;
      box.style.display = 'flex';
      var d = document.getElementById('error-detail');
      if (d) d.textContent = (e && e.message) ? String(e.message).slice(0, 160) : '';
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
