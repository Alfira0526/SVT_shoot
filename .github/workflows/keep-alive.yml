name: Supabase Keep-Alive

# §6 운영 필수: Supabase 무료 티어는 7일 무활동 시 자동 일시정지.
# 3일마다 REST 엔드포인트를 핑해 활성 상태 유지. (Secrets 미설정 시 스킵 — v1은 localStorage)
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase Secrets 미설정 — v1 파일럿(localStorage)에서는 스킵합니다."
            exit 0
          fi
          # keep-alive는 베스트 에포트 — 호스트 미해석(paused/삭제된 프로젝트)·타임아웃 등
          # curl 실패가 잡을 깨지 않도록 errexit 해제 + `|| true`, --max-time 로 방어.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/scores?select=id&limit=1" || true)
          echo "Supabase ping → HTTP ${code:-000}"
          if [ "${code:-000}" = "000" ]; then
            echo "::warning::Supabase 도달 실패(호스트 미해석/타임아웃). 프로젝트 URL·상태 확인 권장 — v1은 localStorage라 무해."
          elif [ "${code:-000}" -ge 500 ] 2>/dev/null; then
            echo "::warning::Supabase 5xx 응답($code) — 프로젝트 상태 확인 권장."
          fi
          # keep-alive 목적상 도달 실패/오류로 CI를 실패시키지 않는다(알림 소음 방지).
          exit 0
